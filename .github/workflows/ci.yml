name: CI

# Lint, format-check, test (and a non-blocking type-check) on every push and PR.
on:
  push:
  pull_request:

jobs:
  lint-test:
    name: lint + test (SQLite)
    runs-on: ubuntu-latest

    env:
      # Tests need a SECRET_KEY at config import time. conftest does
      # os.environ.setdefault(...), so this is belt-and-suspenders, but setting
      # it here keeps CI independent of that default.
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Cache key keys off both manifests so dep bumps invalidate it.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # Importing the backend pulls fastapi/sqlalchemy/slowapi/etc., and the
        # test suite imports app.* which pulls the ML stack, so the full runtime
        # requirements are needed. torch makes this step slow (multi-minute) but
        # correctness wins; pip cache amortises it across runs. Slimming the
        # dep set (CPU-only torch) is a deferred follow-up, not part of C2.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff (lint, non-blocking)
        # Non-blocking for now: the repo has pre-existing format/import drift in
        # ~32 legacy files (app/*, standalone Streamlit apps, some backend/*)
        # unrelated to the CI rollout. A follow-up normalizes the baseline
        # (black . + ruff --fix .) and flips ruff/black to blocking. Until then
        # pytest is the merge gate. See IMPLEMENTATION_ROADMAP / CURRENT_TASKS.
        continue-on-error: true
        run: ruff check .

      - name: Black (format check, non-blocking)
        # Non-blocking for the same reason as Ruff above — flips to blocking once
        # the one-time baseline normalization lands.
        continue-on-error: true
        run: black --check .

      - name: Pytest (SQLite suite)
        # The existing suite runs against in-memory SQLite over
        # httpx.ASGITransport. pgvector (kb_chunks) + JSONB (audit_logs) are
        # excluded from the SQLite schema — see the Postgres job sketch below.
        run: pytest

      - name: Mypy (type check, non-blocking)
        # The codebase is not mypy-clean yet (see pyproject.toml); strictness is
        # ramped per-module over later phases, so this must not block merges.
        continue-on-error: true
        run: mypy .

      - name: pip-audit (dependency CVE scan, non-blocking)
        # Surfaces known CVEs in pinned deps (security review M2). Non-blocking
        # for now — a known CVE in the heavy ML stack shouldn't block unrelated
        # merges; review the report and patch deliberately. Container image
        # scanning (Trivy/Grype on the built image) is a heavier follow-up.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # Docker image build + no-infra runtime smoke.
  #
  # This is the gate that finally validates the container build path (blocker
  # B-1): if `./Dockerfile` can't build, the workflow fails. Kept as a SEPARATE
  # job from `lint-test` so a broken image is visually distinct from a broken
  # test in the Actions UI, and so the two run in PARALLEL for faster feedback
  # (no `needs:` — the build does not depend on the test suite passing).
  docker-build:
    name: docker build + smoke
    runs-on: ubuntu-latest
    # The ML stack (torch + sentence-transformers) makes this a multi-minute,
    # multi-GB build; give it generous headroom over the default 6h cap so a
    # genuine hang fails fast but a normal cold cache run still completes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        # push: false  -> never authenticate to / push to a registry (no secrets).
        # load: true   -> load the built image into the local docker daemon so the
        #                 smoke steps below can `docker run` it.
        # GitHub Actions layer cache amortises the slow ML wheel layers run-to-run.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: acs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No-infra runtime smokes: prove the image actually works without standing
      # up Postgres/Redis/etc. Only SECRET_KEY is supplied (required at config
      # import time). IMPORTANT: ENVIRONMENT is deliberately NOT set to
      # `production` — that flips rate-limiting into a Redis-required fail-fast
      # and would fail these smokes spuriously.
      - name: Smoke — config imports (cheap gate)
        run: docker run --rm -e SECRET_KEY=ci-not-secret acs:ci python -c "import backend.config; print('config ok')"

      - name: Smoke — alembic wired (migrate tool)
        run: docker run --rm -e SECRET_KEY=ci-not-secret acs:ci alembic --help

      - name: Smoke — app imports (heavy; proves torch/sentence-transformers wheels load)
        run: docker run --rm -e SECRET_KEY=ci-not-secret acs:ci python -c "import backend.main; print('app import ok')"

