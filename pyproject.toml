# Tooling configuration. Linting/formatting/type-checking are introduced in
# Phase 0 as a foundation; strictness is ramped up per-module over later phases
# (see IMPLEMENTATION_ROADMAP.md). The codebase is not expected to pass a strict
# mypy run yet.

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["venv", "alembic/versions", "notebook"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter; prompts have long strings
    "B008",  # FastAPI's Depends() in defaults is the intended pattern
]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "venv|alembic/versions|notebook"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
exclude = ["venv", "alembic", "notebook"]

[tool.pytest.ini_options]
# Async tests use httpx.ASGITransport (TestClient is incompatible with httpx
# 0.28). asyncio_mode=auto runs `async def test_*` without per-test markers.
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# `backend`/`app` are top-level packages that are NOT pip-installed, so they
# only import when the repo root is on sys.path. `python -m pytest` adds the CWD
# implicitly; bare `pytest` (used in CI) does not, which broke `import backend`
# in tests/conftest.py. Adding the repo root here makes both invocations work.
pythonpath = ["."]
